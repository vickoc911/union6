checkdelegate-indicator-checked:
    selectors:
    -   type: CheckDelegate
        child:
            type: Indicator
    layout:
        alignment:
            container: Item
            horizontal: End
            vertical: Center

checkdelegate-indicator-checked:
    selectors:
    -   type: CheckDelegate
        state: Checked
        child:
            type: Indicator
    layout:
        alignment:
            container: Item
            horizontal: End
            vertical: Center
    background:
        path: widgets/checkmarks
        image:
            property: element-image
            element: checkbox
