base: &base
    type: RadioIndicator
    path: widgets/radiobutton
    background: &base-background
        element: hint-size
        size:
            property: element-size

unchecked: &unchecked
    <<: *base
    attributes: {checked: false}
    background:
        <<: *base-background
        image:
            property: element-image-blend
            elements: [shadow, normal]

unchecked-pressed:
    <<: *unchecked
    state: Pressed
    background:
        <<: *base-background
        image:
            property: element-image-blend
            elements: [normal, checked]

unchecked-focused:
    <<: *unchecked
    state: VisualFocus
    background:
        <<: *base-background
        image:
            property: element-image-blend
            elements: [shadow, normal, focus]

