checked: &checked
    <<: *base
    attributes: {checked: true}
    background:
        <<: *base-background
        image:
            property: element-image-blend
            elements: [shadow, normal, checked, symbol]

checked-pressed:
    <<: *checked
    state: Pressed
    background:
        <<: *base-background
        image:
            property: element-image-blend
            elements: [normal, checked, symbol]

checked-focused:
    <<: *checked
    state: VisualFocus
    background:
        <<: *base-background
        image:
            property: element-image-blend
            elements: [shadow, normal, focus, symbol]

